# GWAS Manhattan 图测试配置
# 用法: paper-pipeline run --config test/gwas_manhattan_test.yaml figures-gwas-manhattan
#
# 运行前请确认:
#   1. PROJECT_ROOT 指向本项目根目录
#   2. 参考文件 (gene_annotation, gene_map, geneset) 存在于共享路径
#   3. GWAS 文件存在于 file_id_map 指定的路径
#   4. conda 环境 paper-pipeline-plot 已创建

project_root: ..
artifact_root: /gpfs/chencao/qinminzhang/workflow/catalog_lof/fgtest/outputs

executables:
  plot_rscript:
    - conda
    - run
    - --no-capture-output
    - -n
    - paper-pipeline-plot
    - Rscript

workflows:
  figures:
    shared_inputs:
      file_id_map: ../configs/path.file_id_map.tsv
      gene_annotation: /gpfs/chencao/qinminzhang/Nature/mine/code/data/GWAS/genes.protein_coding.v39.gtf
      gene_map: /gpfs/chencao/qinminzhang/Nature/mine/code/data/gencode_v41_gname_gid_ALL_sorted_onlyID
      geneset_dir: /gpfs/chencao/qinminzhang/Nature/mine/code/data/geneset

    shared_parameters:
      highlight_genesets:
        - HALLMARK_HEME_METABOLISM
        - Hematopoiesisgenes
        - mitotic_cell_cycle
        - positive_macromolecule_synthesis
      flank_bp: 50000
      label_p_threshold: 1.0e-30
      genomewide_threshold: 5.0e-8

    gwas_manhattan:
      parameters:
        gwas_ids:
          - GCST90079736
          - GCST90079737
          - GCST90080060
          - GCST90079734
          - GCST90081171
