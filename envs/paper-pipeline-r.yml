channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base==4.5.3
  - r-data.table==1.17.8
  - r-dplyr==1.2.0
  - r-ksamples==1.2_12
  - bioconductor-limma==3.66.0
  - bioconductor-edger==4.8.2
