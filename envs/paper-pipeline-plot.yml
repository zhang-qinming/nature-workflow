# Notes:
# - `plot-*` workflows now execute legacy R and bash scripts through this environment.
# - `ldsc.py` and `liftOver` remain external executables because deployments often use
#   site-specific installs or wrappers. Configure them in `executables.ldsc_py` and
#   `executables.liftover`.
# - Extra packages installed here because current package-owned plotting scripts import them:
#   `ggrastr`, `scattermore`, `ggbreak`, `MASS`.
# - The following CRAN packages are still manual extras because they are not currently
#   available from the configured conda channels (`conda-forge`, `bioconda`):
#   `topr`, `ggallin`, `ggarchery`.
# - Workflows that need the manual extras:
#   `plot-gene-burden` -> `topr`
#   `plot-perturbseq-cnmf` -> `ggallin`
#   `plot-supplementary` -> `ggarchery`
